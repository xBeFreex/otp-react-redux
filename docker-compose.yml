# Container logs are capped at 3 x 50 MB per container; without a limit the
# json-file driver grows without bound and fills the host disk.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  otp-react-redux:
    logging: *default-logging
    image: ghcr.io/xbefreex/otp-react-redux:dev
    container_name: otp-react-redux
    ports:
      - "3001:80"
    restart: unless-stopped
